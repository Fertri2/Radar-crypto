name: Leboncoin

on:
  push:
    branches: [main]
    paths: ['site/data/lbc.json']   # un nouveau lot d'annonces déposé depuis le navigateur
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données déjà publiées
        run: |
          mkdir -p site/data
          for f in signals trend rot track auto lbc-all rech; do curl -fsSL "https://fertri2.github.io/Radar-crypto/data/$f.json?t=$(date +%s)" -o "site/data/$f.json" || rm -f "site/data/$f.json"; done
          for f in icon-192.png icon-512.png; do curl -fsSL "https://fertri2.github.io/Radar-crypto/$f" -o "site/$f" || rm -f "site/$f"; done
      - name: Fusionner le lot Leboncoin et alerter
        run: |
          node lbc-alert.mjs
          RECH_AS24=0 node scan-recherches.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
