name: Scan auto

on:
  schedule:
    - cron: '7 5-22 * * *'   # toutes les heures, de 6 h à 23 h (heure de Paris en hiver)
  workflow_dispatch:          # bouton « Run workflow » pour lancer un scan à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données déjà publiées (crypto + auto)
        run: |
          mkdir -p site/data
          for f in signals trend rot track auto; do curl -fsSL "https://fertri2.github.io/Radar-crypto/data/$f.json?t=$(date +%s)" -o "site/data/$f.json" || rm -f "site/data/$f.json"; done
          for f in icon-192.png icon-512.png; do curl -fsSL "https://fertri2.github.io/Radar-crypto/$f" -o "site/$f" || rm -f "site/$f"; done
      - name: Scanner les annonces auto
        run: node scan-auto.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
